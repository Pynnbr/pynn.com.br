<style>
  :root{
    --bg:#ffffff;
    --bg-panel:#ffffff;
    --fg:#121212;
    --fg-muted:#6b6b68;
    --border:#e2e2df;
    --coral:#1652C4;
    --coral-soft:#1652C41f;
    --blue:#2F8CFF;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    background:var(--bg);
    color:var(--fg);
    font-family:'Inter',sans-serif;
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:100vh;
    padding:24px;
    position:relative;
    overflow:hidden;
  }
  body::before{
    content:"";
    position:absolute; top:0; left:0; right:0; height:900px; z-index:0; pointer-events:none;
    background: radial-gradient(1100px circle at 50% -8%, var(--coral-soft), transparent 62%);
  }
  .wrap{
    position:relative; z-index:1;
    max-width:560px;
    width:100%;
    text-align:center;
  }
  .logo{
    display:inline-block;
    margin-bottom:48px;
    text-decoration:none;
  }
  .logo img{
    height:32px;
    width:auto;
    display:block;
  }
  .code{
    font-family:'Manrope',sans-serif;
    font-weight:800;
    font-size:clamp(4.5rem, 18vw, 8rem);
    line-height:1;
    background:linear-gradient(135deg, var(--coral), var(--blue));
    -webkit-background-clip:text;
    background-clip:text;
    -webkit-text-fill-color:transparent;
    margin-bottom:8px;
  }
  h1{
    font-family:'Manrope',sans-serif;
    font-weight:700;
    font-size:1.4rem;
    margin-bottom:14px;
  }
  p{
    color:var(--fg-muted);
    font-size:.98rem;
    line-height:1.6;
    max-width:420px;
    margin:0 auto 32px;
  }
  .actions{
    display:flex;
    flex-wrap:wrap;
    gap:12px;
    justify-content:center;
  }
  .btn{
    font-family:'Inter',sans-serif;
    font-weight:600;
    font-size:.78rem;
    padding:9px 16px;
    border-radius:8px;
    text-decoration:none;
    cursor:pointer;
    transition:transform .15s ease, opacity .15s ease;
    display:inline-flex;
    align-items:center;
    gap:6px;
  }
  .btn:hover{ transform:translateY(-2px); }
  .btn-solid{
    background:var(--coral);
    color:#fff;
  }
  .btn-ghost{
    background:transparent;
    border:1px solid var(--border);
    color:var(--fg);
  }
  .btn svg{ width:13px; height:13px; flex-shrink:0; }
</style>
</head>
